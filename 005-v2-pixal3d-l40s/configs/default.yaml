# 005-v2 defaults — L40S Ada sm_89 plan (not yet runtime-validated)
experiment: 005-v2-pixal3d-l40s
status: SOLUTION_LOCKED_NOT_RUN

gpu:
  default: L40S
  allowed: [L40S]          # v2 is L40S-only; do not silently fall back to H100
  compute_capability: "8.9"
  sm: sm_89

stack:
  plan: A                    # A = official source build; B = carroyoaesa wheels
  python: "3.10"
  torch: "2.6.0+cu124"
  attn_backend: sdpa
  torch_cuda_arch_list: "8.9"
  natten_cuda_arch: "8.9"
  natten_version: "0.21.0"
  forbid_hfdemo_wheels: true

inference:
  low_vram: true
  resolution: 1024
  # peak ~16GB expected; L40S has 48GB headroom

volumes:
  wheels: modal-lab-pixal3d-l40s-wheels
  weights: modal-lab-pixal3d-l40s-weights   # can later RO-mount 005 weights
  outputs: modal-lab-pixal3d-l40s-outputs

gates:
  require_sm89_cubin: true
  require_natten_lib: true
  skip_inference_if_gate_fails: true

plan_b:
  enabled: false
  python: "3.12"
  torch: "2.9.1+cu129"
  wheels_release: >-
    https://github.com/carroyoaesa/comfyui-trellis2-pixal3d-rtx40-ada-sm89-wheels-debian13/releases/download/v1.0.0

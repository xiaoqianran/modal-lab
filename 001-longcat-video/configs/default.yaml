# 001-longcat-video 默认配置
# 优先级: CLI > 本文件 > 代码内默认值
#
# 官方基础 Demo CLI 仅支持:
#   --context_parallel_size  --checkpoint_dir  --enable_compile
# prompt / 分辨率等写死在官方脚本内，不能通过 script_args 伪造。

infra:
  # 资源档位: pro6000-1 | pro6000-2 | a100-80-1 | a100-80-2 | h100-1
  profile: pro6000-1
  # 以下为 null 时使用档位默认；非 null 覆盖档位
  gpu: null
  nproc: null
  cpu: null
  memory_mb: null
  timeout_s: null
  enable_compile: true
  hf_repo: meituan-longcat/LongCat-Video
  force_download: false

# 透传给官方脚本的参数（仅白名单内字段）
script_args:
  context_parallel_size: 1
  # enable_compile 由 infra.enable_compile 注入；也可在此写 true/false

checkpoint_dir: /weights/LongCat-Video
# Volume 内输出子目录；null 时用 demo 名
output_subdir: null

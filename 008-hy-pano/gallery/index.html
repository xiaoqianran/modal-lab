<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>008 · HY-Pano (Qwen) · Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0e12; --elev: #141820; --line: rgba(255,255,255,.08);
      --fg: #eef1f6; --muted: #8b93a7; --accent: #3dd6c6; --ok: #3dd68c;
      --font: "DM Sans", system-ui, sans-serif; --mono: "JetBrains Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100%; color: var(--fg); font-family: var(--font);
      background:
        radial-gradient(1000px 500px at 10% -10%, rgba(61,214,198,.12), transparent 55%),
        radial-gradient(800px 400px at 100% 0%, rgba(240,164,110,.08), transparent 50%),
        var(--bg);
    }
    .wrap { width: min(1100px, calc(100% - 2rem)); margin: 0 auto; padding: 1.5rem 0 3rem; }
    .eyebrow { color: var(--accent); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
    h1 { margin: .4rem 0; font-size: clamp(1.5rem, 3vw, 2.1rem); letter-spacing: -.03em; }
    .lede { color: var(--muted); max-width: 50ch; }
    .stats { display: grid; grid-template-columns: repeat(2,1fr); gap: .75rem; margin: 1.25rem 0; }
    @media (min-width:720px){ .stats { grid-template-columns: repeat(4,1fr); } }
    .stat { background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 14px; padding: .9rem 1rem; }
    .stat .l { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
    .stat .v { font-size: 1.2rem; font-weight: 700; margin-top: .2rem; font-variant-numeric: tabular-nums; }
    .stat .s { color: var(--muted); font-size: .78rem; font-family: var(--mono); margin-top: .15rem; }
    .panel { background: var(--elev); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin-bottom: 1.1rem; box-shadow: 0 18px 50px rgba(0,0,0,.4); }
    .panel-h { padding: .9rem 1.1rem; border-bottom: 1px solid var(--line); }
    .panel-h h2 { margin: 0; font-size: 1rem; }
    .panel-h p { margin: .2rem 0 0; color: var(--muted); font-size: .82rem; }
    .pair { display: grid; gap: 0; }
    @media (min-width:800px){ .pair { grid-template-columns: 1fr 2.2fr; } }
    figure { margin: 0; border-top: 1px solid var(--line); background: #07090d; }
    @media (min-width:800px){
      figure { border-top: 0; border-left: 1px solid var(--line); }
      figure:first-child { border-left: 0; }
    }
    figure img { display: block; width: 100%; height: auto; }
    figcaption { padding: .5rem .75rem .7rem; color: var(--muted); font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; }
    pre { margin: 0; padding: 1rem; overflow: auto; max-height: 320px; font-family: var(--mono); font-size: .72rem; color: #c8d0e0; background: #0a0d12; }
    footer { color: var(--muted); font-size: .82rem; display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; justify-content: space-between; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">008 · HY-Pano 2.0 · Qwen+LoRA（轻量）</div>
    <h1>全景生成结果</h1>
    <p class="lede">官方轻量后端：Qwen-Image-Edit-2509 + HY-Pano LoRA。未跑 80B 全量。</p>
    <section class="stats" id="stats"></section>
    <section class="panel">
      <div class="panel-h">
        <h2>Input → 360° ERP</h2>
        <p>左：输入透视 · 右：生成全景（可横向滚动查看）</p>
      </div>
      <div class="pair">
        <figure>
          <img src="assets/input.jpg" alt="input" />
          <figcaption>Input</figcaption>
        </figure>
        <figure style="overflow-x:auto">
          <img src="assets/panorama.png" alt="panorama" style="min-width:100%" />
          <figcaption>Panorama · 960×1952</figcaption>
        </figure>
      </div>
    </section>
    <section class="panel">
      <div class="panel-h"><h2>meta.json</h2><p>耗时 / 估费 / peak VRAM</p></div>
      <pre id="meta">loading…</pre>
    </section>
    <footer>
      <div>Upstream <a href="https://github.com/Tencent-Hunyuan/HY-World-2.0">HY-World-2.0</a> · panogen Qwen backend</div>
      <div id="foot">run: smoke_qwen</div>
    </footer>
  </div>
  <script>
    fetch('assets/meta.json').then(r=>r.json()).then(m=>{
      const sec=m.seconds||{};
      const v=m.vram||{};
      document.getElementById('stats').innerHTML = [
        ['GPU', m.gpu_request||'—', m.load_mode||''],
        ['Cost', m.est_cost_usd!=null?('$'+Number(m.est_cost_usd).toFixed(4)):'—', 'est. GPU only'],
        ['Total', sec.total!=null?(sec.total+'s'):'—', 'load '+(sec.load??'—')+'s · fwd '+(sec.forward??'—')+'s'],
        ['Peak VRAM', v.peak_mem_used_gb_max!=null?(v.peak_mem_used_gb_max+' GB'):'—', 'of ~80 GB'],
      ].map(([l,v,s])=>`<div class="stat"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');
      document.getElementById('meta').textContent = JSON.stringify(m, null, 2);
      document.getElementById('foot').textContent = 'run: '+(m.run_dir||'smoke_qwen');
    }).catch(e=>{ document.getElementById('meta').textContent=String(e); });
  </script>
</body>
</html>

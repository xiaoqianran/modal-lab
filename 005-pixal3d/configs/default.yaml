# 005-pixal3d defaults
# 默认 H100：HF demo 轮子原生 sm_90。A100-40GB 需先 build-natten。
gpu: H100
cpu: 4
memory_mb: 24576
timeout_s: 7200

# 推理（实测峰值约 15–16GB）
seed: 42
low_vram: true
resolution: 1024   # 1024 | 1536
fov: -1.0          # <0 = MoGe 自动估计

# 权重 / 输出
hf_model: TencentARC/Pixal3D
weights_volume: modal-lab-pixal3d-weights
outputs_volume: modal-lab-pixal3d-outputs

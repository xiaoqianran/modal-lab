experiment: 005-v3-pixal3d-pro6000
status: RESEARCH_ONLY_NOT_RUN

gpu:
  default: RTX-PRO-6000
  compute_capability: "12.0"
  sm: sm_120

stack:
  plan: A
  # Must NOT reuse 005/v2 torch2.6+cu124
  python: "3.12"          # preferred; 3.11 also ok
  torch: ">=2.7+cu128"    # verify sm_120 in get_arch_list()
  cuda_toolkit: ">=12.8"
  torch_cuda_arch_list: "12.0"
  natten_cuda_arch: "12.0"
  attn_backend: sdpa
  forbid_hfdemo_wheels: true
  forbid_windows_wheels: true

gates:
  require_sm120_in_torch_arch_list: true
  require_capability_12_x: true
  probe_before_full_build: true

inference:
  low_vram: true
  resolution: 1024
  # VRAM not the bottleneck (~16GB peak elsewhere); stack is

related:
  production_paths:
    - 005-pixal3d   # H100
    - 005-v2-pixal3d-l40s  # L40S proven
